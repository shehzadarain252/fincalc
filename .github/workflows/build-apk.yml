# FinCalc — GitHub Actions cloud build (debug APK)
#
# Same pattern as the EduMind AI workflow (proven): this project has NO
# gradlew / gradlew.bat and NO gradle-wrapper.jar, so "./gradlew
# assembleDebug" fails. The workflow installs Gradle 8.7 itself and runs
# the plain `gradle` command. Do NOT "fix" it by switching back to
# ./gradlew unless the wrapper scripts + jar are added.
#
# How to use (after signing in to GitHub as shehzadarain252):
#   1. Push this whole project to a new GitHub repo (see .gitignore).
#   2. GitHub > repo > Actions > "Build APK" > Run workflow (or push to main).
#   3. When the run finishes, download the "fincalc-debug-apk" artifact
#      (app-debug.apk) and install it on the phone.
# Notes:
#   - This builds the DEBUG apk only (no signing key needed).
#   - Project facts: AGP 8.5.2, Gradle 8.7, Java/Kotlin JVM 17,
#     compileSdk/targetSdk 34, minSdk 26, applicationId com.fincalc.app,
#     version 1.0.0 (code 1).

name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 2026-11-14 fix: the action's default package list includes the
          # obsolete "tools" package, which no longer exists in
          # cmdline-tools 16.0 (all Build APK runs failed in this step with
          # "Failed to find package 'tools'"). Pin cmdline-tools to 12.0
          # (which still ships it) and install only platform-tools
          # explicitly — the platform/build-tools install is the next step.
          cmdline-tools-version: "12.0"
          packages: platform-tools

      - name: Install Android platform 34
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.7 (no wrapper in this project)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fincalc-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
